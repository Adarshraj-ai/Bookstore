<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>BooksWorld Profile</title>
  <style>
    body { margin: 0; min-height: 100vh; background: radial-gradient(circle at top, #081c35, #0f233f 50%, #030712 100%); color: #eef2ff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    .navbar-container {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      box-shadow: 0 8px 32px rgba(0,0,0,0.15);
      position: sticky;
      top: 0;
      z-index: 1000;
      height: 110px;
    }
    .navbar {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      flex-wrap: wrap;
      gap: 15px;
    }
    .logo {
      font-size: 28px;
      font-weight: 800;
      color: white;
      text-decoration: none;
      text-shadow: 0 2px 4px rgba(0,0,0,0.2);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    nav {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
    }
    nav a {
      text-decoration: none;
      color: white;
      font-weight: 600;
      padding: 10px 18px;
      border-radius: 20px;
      transition: all 0.3s ease;
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.3);
      font-size: 0.95rem;
    }
    nav a:hover {
      background: rgba(255,255,255,0.28);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.15);
    }
    @media (max-width: 768px) {
      .navbar { flex-direction: column; }
      nav { width: 100%; justify-content: center; }
    }
    .back-button { position: absolute; top: 110px; left: 20px; background: linear-gradient(135deg, #38bdf8, #4f46e5); color: white; border: none; border-radius: 999px; padding: 10px 20px; cursor: pointer; font-weight: 700; transition: transform 0.2s ease, box-shadow 0.2s ease; z-index: 50; font-size: 0.9rem; }
    .back-button:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(56, 189, 248, 0.3); }
    .page { position: relative; min-height: 100vh; padding: 24px; }
    .profile-card { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.18); border-radius: 28px; padding: 32px; box-shadow: 0 24px 60px rgba(0,0,0,0.28); }
    .profile-card h2 { margin-top: 0; font-size: 2.6rem; margin-bottom: 18px; color: #eef2ff; }
    .profile-info { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 18px; margin: 24px 0; }
    .profile-info p { margin: 0; padding: 18px; border-radius: 18px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #dbeafe; line-height: 1.6; }
    .profile-actions { display: flex; justify-content: center; flex-wrap: wrap; gap: 16px; }
    button, .link-button { border: none; border-radius: 999px; padding: 14px 28px; cursor: pointer; font-weight: 700; transition: transform 0.2s ease, box-shadow 0.2s ease; }
    button { background: #38bdf8; color: #0f172a; }
    .link-button { text-decoration: none; display: inline-block; background: rgba(255,255,255,0.1); color: #eef2ff; }
    button:hover, .link-button:hover { transform: translateY(-2px); box-shadow: 0 16px 30px rgba(0,0,0,0.2); }
    .login-prompt { text-align: center; font-size: 1.05rem; color: #cbd5e1; }
    .login-prompt a { color: #38bdf8; text-decoration: none; }
    .login-prompt a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="navbar-container">
    <div class="navbar">
      <a href="home.html" class="logo">📚 BooksWorld</a>
      <nav>
        <a href="shop.html">🛍️ Shop</a>
        <a href="cart.html">🛒 Cart</a>
        <a href="orders.html">📦 Orders</a>
        <a href="profile.html">👤 Profile</a>
      </nav>
    </div>
  </div>
  <button class="back-button" onclick="goBack()">← Back</button>
  <div class="page">
    <div class="profile-card">
      <h2>User Profile</h2>
      <div id="profileContent">
        <p class="login-prompt">Please <a href="login.html">login</a> to view your profile.</p>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <script>
    const SUPABASE_URL = 'https://qbpbohrggxsxqhgplhng.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFicGJvaHJnZ3hzeHFoZ3BsaG5nIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg2NTQ4OTgsImV4cCI6MjA5NDIzMDg5OH0.OQWytnXW5-WNRMWYM8gDB2qIb_IXpOsA1W271HvcnxU';
    const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    async function loadProfile() {
      const { data } = await client.auth.getUser();
      const user = data?.user;
      const content = document.getElementById('profileContent');
      if (user) {
        const orders = JSON.parse(localStorage.getItem('orders') || '[]');
        const cart = JSON.parse(localStorage.getItem('cart') || '[]');
        content.innerHTML = `
          <div class="profile-info">
            <p><strong>Email</strong><br>${user.email}</p>
            <p><strong>User ID</strong><br>${user.id}</p>
            <p><strong>Joined</strong><br>${new Date(user.created_at).toLocaleDateString()}</p>
            <p><strong>Orders Placed</strong><br>${orders.length}</p>
            <p><strong>Books in Cart</strong><br>${cart.length}</p>
          </div>
          <div class="profile-actions">
            <button onclick="logout()">Logout</button>
            <a class="link-button" href="orders.html">View Orders</a>
          </div>
        `;
      } else {
        content.innerHTML = `<p class="login-prompt">Please <a href="login.html">login</a> to view your profile and order history.</p>`;
      }
    }
    async function logout() {
      await client.auth.signOut();
      alert('Logged out successfully!');
      window.location.href = 'home.html';
    }

    function goBack() {
      if (window.history.length > 1) {
        history.back();
      } else {
        window.location.href = 'home.html';
      }
    }

    loadProfile();
  </script>
</body>
</html>
