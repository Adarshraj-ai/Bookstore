<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Online Book Store - Register</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container register-page">
    <form id="registerForm" class="register-card">
      <div class="register-header">
        <h2>Join BookWorld</h2>
        <p class="subtitle">Create your account and start discovering your next favorite read.</p>
      </div>

      <div id="registerError" class="error"></div>

      <div class="input-group">
        <input type="email" id="registerEmail" placeholder="Email" required>
      </div>
      <div class="input-group">
        <input type="password" id="registerPassword" placeholder="Password (min 6 chars)" required>
      </div>
      <div class="input-group">
        <input type="password" id="registerConfirm" placeholder="Confirm Password" required>
      </div>

      <button type="submit">Create Account</button>

      <div class="toggle">Already have an account? <a href="login.html">Login</a></div>
    </form>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <script src="script.js"></script>
</body>
</html>
