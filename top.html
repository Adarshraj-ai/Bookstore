<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f8f9fa; }
    
    .navbar-container {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      box-shadow: 0 8px 32px rgba(0,0,0,0.15);
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .navbar {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      flex-wrap: wrap;
      gap: 15px;
    }

    .logo {
      font-size: 28px;
      font-weight: 800;
      color: white;
      text-decoration: none;
      text-shadow: 0 2px 4px rgba(0,0,0,0.2);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .search-bar {
      flex: 1;
      min-width: 200px;
      max-width: 450px;
    }

    .search-bar input {
      width: 100%;
      padding: 10px 15px;
      border: none;
      border-radius: 25px;
      outline: none;
      font-size: 0.95rem;
      background: rgba(255,255,255,0.95);
      transition: box-shadow 0.3s ease;
    }

    .search-bar input:focus {
      box-shadow: 0 0 0 3px rgba(255,255,255,0.3);
    }

    nav {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
    }

    nav a {
      text-decoration: none;
      color: white;
      font-weight: 600;
      padding: 10px 18px;
      border-radius: 20px;
      transition: all 0.3s ease;
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.3);
      font-size: 0.95rem;
    }

    nav a:hover {
      background: rgba(255,255,255,0.28);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.15);
    }

    .cart-icon {
      position: relative;
      font-size: 20px;
      cursor: pointer;
    }

    @media (max-width: 768px) {
      .navbar { flex-direction: column; }
      .search-bar { min-width: 100%; }
      nav { width: 100%; justify-content: center; }
    }
  </style>
</head>
<body>
  <div class="navbar-container">
    <div class="navbar">
      <a href="home.html" target="_top" class="logo">📚 BooksWorld</a>
      <nav>
        <a href="shop.html">🛍️ Shop</a>
        <a href="cart.html" target="_top">🛒 Cart</a>
        <a href="orders.html" target="_top">📦 Orders</a>
        <a href="profile.html" target="_top">👤 Profile</a>
      </nav>
    </div>
  </div>
</body>
</html>
