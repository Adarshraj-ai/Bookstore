<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Online Book Store - Login</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', Arial, sans-serif;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #111827;
      background: linear-gradient(180deg, rgba(15, 23, 42, 0.6), rgba(15, 23, 42, 0.9)),
        url("img.avif") no-repeat center center fixed;
      background-size: cover;
      overflow: hidden;
    }

    .container {
      width: min(420px, 100%);
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid rgba(148, 163, 184, 0.25);
      border-radius: 32px;
      box-shadow: 0 36px 80px rgba(15, 23, 42, 0.24);
      padding: 36px 32px 30px;
      backdrop-filter: blur(18px);
      animation: fadeIn 1.2s ease both;
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 22px;
    }

    .brand-mark {
      width: 52px;
      height: 52px;
      border-radius: 18px;
      background: linear-gradient(135deg, #4f46e5, #2563eb);
      display: grid;
      place-items: center;
      color: #fff;
      font-weight: 700;
      font-size: 22px;
    }

    .brand-text {
      text-align: left;
    }

    .brand-text span {
      display: block;
      font-size: 14px;
      color: #4b5563;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .brand-text p {
      margin: 4px 0 0;
      font-size: 0.95rem;
      color: #64748b;
      line-height: 1.5;
    }

    .container h2 {
      font-size: 32px;
      line-height: 1.05;
      margin-bottom: 8px;
      text-align: center;
    }

    .subtitle {
      margin-bottom: 28px;
      color: #475569;
      text-align: center;
      line-height: 1.6;
      font-size: 15px;
    }

    .input-group {
      margin-bottom: 16px;
    }

    input {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid rgba(148, 163, 184, 0.35);
      border-radius: 16px;
      background: #f8fafc;
      color: #111827;
      font-size: 15px;
      transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
    }

    input::placeholder {
      color: #94a3b8;
    }

    input:focus {
      outline: none;
      border-color: #2563eb;
      box-shadow: 0 0 0 6px rgba(59, 130, 246, 0.12);
      transform: translateY(-1px);
    }

    button {
      width: 100%;
      padding: 14px 16px;
      border: none;
      border-radius: 18px;
      background: linear-gradient(135deg, #4f46e5, #2563eb);
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 18px 38px rgba(37, 99, 235, 0.2);
      opacity: 0.98;
    }

    .helper-row {
      margin-top: 18px;
      text-align: center;
      font-size: 14px;
      color: #64748b;
    }

    .helper-row a {
      color: #2563eb;
      text-decoration: none;
      font-weight: 700;
    }

    .helper-row a:hover {
      text-decoration: underline;
    }

    .error {
      color: #dc2626;
      margin-bottom: 14px;
      font-size: 14px;
      min-height: 20px;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(24px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    

    @media (max-width: 420px) {
      .container {
        padding: 28px 20px 24px;
        border-radius: 26px;
      }

      .container h2 {
        font-size: 28px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="brand">
      <div class="brand-mark">B</div>
      <div class="brand-text">
        <span>BooksWorld</span>
        <p>Public bookstore for every reader.</p>
      </div>
    </div>

    <h2>Welcome back to BooksWorld</h2>
    <p class="subtitle">Sign in to continue browsing stories, self-help, science, and every book category.</p>

    <form id="loginForm">
      <div id="loginError" class="error"></div>
      <div class="input-group">
        <input type="email" id="loginEmail" placeholder="Email" required>
      </div>
      <div class="input-group">
        <input type="password" id="loginPassword" placeholder="Password" required>
      </div>
      <button type="submit">Login</button>
      <div class="helper-row">Don't have an account? <a href="register.html">Register</a></div>
    </form>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <script src="script.js"></script>
</body>
</html>
